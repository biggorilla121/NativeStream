[package]
name = "nativestream"
version = "0.1.0"
description = "NativeStream desktop app"
authors = ["NativeStream"]
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "2.5.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }
